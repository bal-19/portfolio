name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # tiap hari jam 00:00 UTC
  workflow_dispatch: # biar bisa trigger manual juga

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/fetch-github-stats.mjs

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          git diff --staged --quiet || git commit -m "chore: update github stats"
          git push
